name: Daily Push Notification

on:
  schedule:
    - cron: '0 22 * * *'  # 日本时间早晨 07:00
    - cron: '0 9 * * *'   # 日本时间晚上 18:00
  workflow_dispatch:

jobs:
  run-python-script:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖库
        run: |
          pip install requests

      - name: 运行主脚本
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
        run: python main.py
