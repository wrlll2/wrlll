name: Daily Push Notification

on:
  schedule:
    # UTC 时间 00:00 对应北京时间 08:00
    - cron: '0 0 * * *'
  workflow_dispatch: # 允许在 GitHub 网页手动点击触发

jobs:
  run-python-script:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖库
        run: |
          pip install requests

      - name: 运行主脚本
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
        run: python main.py
